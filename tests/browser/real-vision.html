<!doctype html><html lang="id"><meta charset="utf-8"><title>Actual MediaPipe browser test</title><body><script type="module">
import {segmentPerson} from "../../src/core/vision.js";
import {refineMask} from "../../src/core/mask-refinement.js";
import {segmentPortraitMatte} from "../../src/core/portrait-matting.js";
import {prepareCutout,composeCutout,backdropPlan} from "../../src/core/local-image.js";
const notes=[];const info=console.info;console.info=(...a)=>{if(String(a[0]).startsWith("LINGGAU_"))notes.push(a.join(" "));info(...a);};
try{
 const img=new Image();img.src="/vision-portrait.jpg";await img.decode();
 const scale=Math.min(1,512/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement("canvas");
 c.width=Math.max(1,Math.round(img.naturalWidth*scale));c.height=Math.max(1,Math.round(img.naturalHeight*scale));c.getContext("2d").drawImage(img,0,0,c.width,c.height);
 const refine=(m,canvas)=>{const r=document.createElement("canvas");r.width=m.width;r.height=m.height;const x=r.getContext("2d");x.drawImage(canvas,0,0,r.width,r.height);return refineMask(m,x.getImageData(0,0,r.width,r.height).data);};
 const m=refine(await segmentPerson(c),c);if(!m.faceCorePixels)throw Error("No confident face core");let selected=0;for(const a of m.alpha)if(a>=128)selected++;const ratio=selected/m.alpha.length;
 if(ratio<.03||ratio>.97)throw Error("Unusable foreground coverage "+ratio);
 const center=m.alpha[Math.floor(m.height/2)*m.width+Math.floor(m.width/2)];
 if(center<128)throw Error("Portrait center not selected "+center);
 const asset={mimeType:"image/png",base64:c.toDataURL("image/png").split(",")[1]};
 const result=await composeCutout(await prepareCutout(asset,[],false,m),backdropPlan({background:"Putih bersih"}));
 if(!result.pixelVerified||!result.protectedPixels)throw Error("PNG pixel verification failed");
 // A grayscale, closer crop of the same public portrait is a separate stress case.
 const g=document.createElement("canvas");g.width=320;g.height=320;const gc=g.getContext("2d");
 const side=Math.min(c.width,c.height)*.76;gc.filter="grayscale(1)";gc.drawImage(c,(c.width-side)/2,0,side,side,0,0,320,320);
 const gm=refine(await segmentPerson(g),g);if(!gm.faceCorePixels)throw Error("Grayscale crop lost semantic face core");
 const gr=await composeCutout(await prepareCutout({mimeType:"image/png",base64:g.toDataURL("image/png").split(",")[1]},[],false,gm),backdropPlan({background:"Putih bersih"}));
 if(!gr.pixelVerified||!gr.protectedPixels)throw Error("Grayscale crop verification failed");
 for(const side of ["left","right"]){const shifted=document.createElement("canvas");shifted.width=560;shifted.height=400;const sc=shifted.getContext("2d");sc.fillStyle="#d0d0d0";sc.fillRect(0,0,560,400);const sw=Math.round(c.width*400/c.height),offset=side==="left"?0:560-sw;sc.drawImage(c,offset,0,sw,400);const sm=refine(await segmentPerson(shifted),shifted);if(!sm.faceCorePixels)throw Error("Missing off-center face "+side);let total=0,wrong=0;for(let y=0;y<sm.height;y++)for(let x=0;x<sm.width;x++){const px=(x+.5)*560/sm.width;if(side==="left"?px>sw+12:px<offset-12){total++;if(sm.alpha[y*sm.width+x]>32)wrong++;}}if(!total||wrong/total>.025){let high=0,medium=0,rawWrong=0;for(let y=0;y<sm.height;y++)for(let x=0;x<sm.width;x++){const px=(x+.5)*560/sm.width;if(side==="left"?px>sw+12:px<offset-12){const a=sm.alpha[y*sm.width+x];if(a>=240)high++;else if(a>112)medium++;}}throw Error("Off-center background leakage "+side+" "+wrong/total+" high="+high+" medium="+medium+" cleanup="+sm.cleanupRemovedMass+"/"+sm.cleanupOriginalMass);}const sr=await composeCutout(await prepareCutout({mimeType:"image/png",base64:shifted.toDataURL("image/png").split(",")[1]},[],false,sm),backdropPlan({background:"Putih bersih"}));if(!sr.pixelVerified)throw Error("Off-center PNG verification failed");notes.push(side+" margin leakage="+(wrong/total).toFixed(4));}
 for(const [name,image,base] of [["original",c,m],["grayscale",g,gm]]){const start=performance.now();const matte=await segmentPortraitMatte(image);let selected=0,removed=0,added=0,core=0;for(let i=0;i<matte.alpha.length;i++){if(matte.alpha[i]>=128)selected++;if(base.alpha[i]>=240){core++;if(matte.alpha[i]<128)removed++;}if(base.alpha[i]<=8&&matte.alpha[i]>=128)added++;}if(selected<matte.alpha.length*.03||selected>matte.alpha.length*.97)throw Error("Matte coverage invalid "+name);const r=await composeCutout(await prepareCutout({mimeType:"image/png",base64:image.toDataURL("image/png").split(",")[1]},[],false,matte),backdropPlan({background:"Putih bersih"}));if(!r.pixelVerified)throw Error("Matte PNG verification failed");notes.push("MODNET "+name+" protected="+r.protectedPixels+" disagreement_removed="+(removed/core).toFixed(4)+" disagreement_added="+added+" ms="+Math.round(performance.now()-start));}
 window.__smoke={ok:true,detail:notes.join("; ")+"; foreground="+ratio.toFixed(3)+"; protected="+result.protectedPixels+"; face core="+m.faceCorePixels+"; grayscale face core="+gm.faceCorePixels+"; grayscale protected="+gr.protectedPixels+"; both PNG verified"};
}catch(e){window.__smoke={ok:false,detail:notes.join("; ")+"; "+(e.stack||String(e))};}
</script></body></html>

<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><main id="app"></main>
<script type="module">
import {mount} from "../../src/app.js";
import {prepareWorkingPhoto} from "../../src/core/images.js";
import {renderTextOverlay} from "../../src/core/text-overlay.js";
import {getFeature} from "../../src/core/feature-registry.js";
import {createAIClient} from "../../src/core/ai-client.js";
import {prepareCutout,composeCutout,backdropPlan,sharpenLocal} from "../../src/core/local-image.js";
const assert=(ok,msg)=>{if(!ok)throw Error(msg)};
const wait=async(fn,msg)=>{for(let i=0;i<160;i++){const v=fn();if(v)return v;await new Promise(r=>setTimeout(r,50));}throw Error("timeout: "+msg);};
const btn=(root,t)=>[...root.querySelectorAll("button")].find(b=>b.textContent.trim()===t);
const img=async a=>{const i=new Image();i.src="data:"+a.mimeType+";base64,"+a.base64;await i.decode();return i;};
const sample=document.createElement("canvas");sample.width=80;sample.height=100;const ctx=sample.getContext("2d");ctx.fillStyle="#934218";ctx.fillRect(20,20,40,60);ctx.fillStyle="#ffffff";ctx.fillRect(25,35,30,18);
const asset={mimeType:"image/png",base64:sample.toDataURL("image/png").split(",")[1]};
let calls=0;
const bridge={available:true,editImage:async()=>{throw Error("unexpected editImage")},generateText:async()=>{throw Error("unexpected generateText")},generateImage:async r=>{assert(r.images.length===0,"source leaked to background generation");calls++;return {...asset,kind:"image",elapsedMs:1};}};
async function run(){
 const small=await prepareWorkingPhoto(asset);assert(small.base64===asset.base64&&!small.resized,"small original bytes unchanged");
 const large=document.createElement("canvas");large.width=4000;large.height=3000;const lc=large.getContext("2d");lc.fillStyle="#314559";lc.fillRect(1000,750,2000,1500);
 const bigBlob=await new Promise(r=>large.toBlob(r,"image/png"));const big={mimeType:"image/png",base64:large.toDataURL("image/png").split(",")[1]};
 const fit=await prepareWorkingPhoto(big);assert(fit.resized&&fit.originalWidth===4000&&fit.originalHeight===3000&&fit.width*fit.height<=4000000,"12MP photo fits");
 const fiImage=await img(fit);const verify=document.createElement("canvas");verify.width=fit.width;verify.height=fit.height;const vc=verify.getContext("2d");vc.drawImage(fiImage,0,0);
 assert(vc.getImageData(0,0,1,1).data[3]===0&&vc.getImageData(Math.floor(fit.width/2),Math.floor(fit.height/2),1,1).data[3]===255,"transparency survives resize");large.width=large.height=verify.width=verify.height=1;
 const initial=await prepareCutout(asset,[],true);
 const transparent=await composeCutout(initial,backdropPlan({transparent:true}));
 assert(transparent.pixelVerified&&transparent.protectedPixels===2400,"PNG round trip verification");
 const rendered=await img(transparent);const c=document.createElement("canvas");c.width=80;c.height=100;const p=c.getContext("2d");p.drawImage(rendered,0,0);
 assert(p.getImageData(0,0,1,1).data[3]===0,"transparent edge");
 assert(p.getImageData(25,25,1,1).data[0]===147,"original pixel");
 const sharp=await sharpenLocal(asset,{strength:"Ringan",noise:"Minimal",detail:"Seimbang"});assert(sharp.width===80&&sharp.height===100,"local sharpen dimensions");
 await mount({root:document.querySelector("#app"),ai:bridge,version:"test",revision:"browser"});
 await wait(()=>document.querySelector("#studio .mobile-rail"),"mobile nav");
 const nav=document.querySelector("#studio .mobile-rail");
 await wait(()=>nav.clientWidth>0&&getComputedStyle(nav).overflowX==="auto","mobile stylesheet ready: "+window.innerWidth);
 assert(nav.scrollWidth>nav.clientWidth,"scrollable rail: "+nav.scrollWidth+"/"+nav.clientWidth+" viewport "+window.innerWidth);
 const openTool=(category,id)=>{const cat=nav.querySelector('[aria-label="'+category+'"]');assert(cat,"category "+category);cat.click();const tool=document.querySelector('[data-tool="'+id+'"]');assert(tool,"tool "+id);tool.click();};
 openTool("Editor & Manipulasi Visual","background");
 const input=document.querySelector("#photo-0");
 const bigTransfer=new DataTransfer();bigTransfer.items.add(new File([bigBlob],"large-camera.png",{type:"image/png"}));input.files=bigTransfer.files;input.dispatchEvent(new Event("change",{bubbles:true}));
 await wait(()=>document.querySelector(".source-preview")?.textContent.includes("Foto kerja diperkecil"),"12MP upload prepared with visible disclosure");btn(document,"Hapus foto").click();
 const blob=await new Promise(r=>sample.toBlob(r,"image/png"));const transfer=new DataTransfer();transfer.items.add(new File([blob],"synthetic.png",{type:"image/png"}));input.files=transfer.files;input.dispatchEvent(new Event("change",{bubbles:true}));
 await wait(()=>document.querySelector(".mask-area")?.textContent.includes("Transparansi foto aktif"),"alpha input");
 const transparentBox=document.querySelector(".precision-option input");transparentBox.click();
 const process=btn(document,"Proses foto");await wait(()=>!process.disabled,"process enabled");process.click();
 const accept=await wait(()=>btn(document,"Sesuai, gunakan"),"review");
 assert(!btn(document,"Unduh gambar"),"unreviewed output cannot download");accept.click();
 await wait(()=>btn(document,"Unduh gambar"),"accepted result");
 assert(calls===0,"local export must use zero AI calls");
 assert(document.documentElement.scrollWidth<=window.innerWidth+1,"360px overflow");
 openTool("Studio Foto & Model AI","product-photo");
 assert(document.querySelector("#precision-mode").value==="strict","product defaults to precision");
 assert(document.querySelector("#param-notes").parentElement.hidden,"hidden unsupported notes");
 assert(document.querySelectorAll(".mobile-item").length===10,"7 categories plus assistant, search, results");
 assert(!document.querySelector(".advanced-settings").open,"advanced settings collapsed");
 // Opaque input and vision fixture: browser dialogs must not be required.
 const opaque=document.createElement("canvas");opaque.width=80;opaque.height=100;const o=opaque.getContext("2d");o.fillStyle="#ccc";o.fillRect(0,0,80,100);o.drawImage(sample,0,0);
 const opaqueBlob=await new Promise(r=>opaque.toBlob(r,"image/png"));const dt=new DataTransfer();dt.items.add(new File([opaqueBlob],"opaque.png",{type:"image/png"}));const fi=document.querySelector("#photo-0");fi.files=dt.files;fi.dispatchEvent(new Event("change",{bubbles:true}));
 await wait(()=>document.querySelector(".mask-area")?.textContent.includes("Siap deteksi otomatis"),"opaque input ready");
 assert(!document.querySelector(".precision-correction").open,"advanced corrections collapsed");
 document.querySelector('input[name="param-background"][value="Putih bersih"]').click();
 assert(!btn(document,"Proses foto").disabled,"auto detection can start with no manual mask");
 window.confirm=()=>{throw Error("native dialog not permitted");};
 btn(document,"Proses foto").click();
 await wait(()=>btn(document,"Sesuai, gunakan"),"automatic detection and processing");
 assert(calls===0,"solid background uses no Gemini");
 btn(document,"Sesuai, gunakan").click();
 await wait(()=>btn(document,"Unduh gambar"),"auto output accepted");
 document.querySelector(".advanced-settings").open=true;document.querySelector(".precision-correction").open=true;
 btn(document,"Deteksi objek (AI lokal)").click();
 await wait(()=>document.querySelector(".input-panel .status").textContent.includes("Alat pemisah objek belum siap"),"mock model failure visible");
 assert(!btn(document,"Proses foto").disabled,"previous valid mask retained after failed redetection");
 openTool("Editor & Manipulasi Visual","background");
 const portraitInput=document.querySelector("#photo-0"),portraitTransfer=new DataTransfer();portraitTransfer.items.add(new File([opaqueBlob],"portrait-fixture.png",{type:"image/png"}));portraitInput.files=portraitTransfer.files;portraitInput.dispatchEvent(new Event("change",{bubbles:true}));
 await wait(()=>document.querySelector(".mask-area")?.textContent.includes("Siap deteksi otomatis"),"portrait fixture ready");
 document.querySelector('input[name="param-background"][value="Putih bersih"]').click();btn(document,"Proses foto").click();
 await wait(()=>btn(document,"Sesuai, gunakan"),"portrait route review");assert(calls===0,"portrait solid background must remain local");btn(document,"Sesuai, gunakan").click();await wait(()=>btn(document,"Unduh gambar"),"portrait accepted");
 document.querySelector(".advanced-settings").open=true;document.querySelector(".precision-correction").open=true;btn(document,"Deteksi objek (AI lokal)").click();await wait(()=>document.querySelector(".input-panel .status").textContent.includes("Perapian tepi foto belum berhasil"),"portrait failure feedback");
 nav.querySelector('[aria-label="Cari alat"]').click();const search=document.querySelector('input[aria-label="Cari alat"]');assert(document.querySelectorAll(".category-tool").length===41,"40 registered tools plus local calculator discoverable");search.value="rubrik";search.dispatchEvent(new Event("input",{bubbles:true}));assert(document.querySelectorAll(".category-tool").length===1,"search finds education tool");document.querySelector(".category-tool").click();assert(document.querySelector(".required-fields #param-learningTopic"),"essential brief visible");assert(!document.querySelector(".advanced-settings").open,"text advanced collapsed");assert(document.documentElement.scrollWidth<=window.innerWidth+1,"education 360px overflow");
 nav.querySelector('[aria-label="Aset sesi"]').click();
 const first=document.querySelector(".workspace .grid article");assert(first,"saved asset exists");const pick=first.querySelector('select[aria-label="Fitur tujuan"]');pick.value="background:0";btn(first,"Pakai ulang").click();
 await wait(()=>document.querySelector(".source-preview")?.textContent.includes("Hasil sesi"),"asset reuse without upload");
 await wait(()=>document.querySelector(".mask-area")?.textContent.includes("Siap deteksi otomatis")||document.querySelector(".mask-area")?.textContent.includes("Transparansi foto aktif"),"reused mask input ready");
 nav.querySelector('[aria-label="Aset sesi"]').click();
 const erase=[...document.querySelectorAll(".workspace button")].find(b=>b.textContent==="Bersihkan sesi");erase.click();await wait(()=>document.querySelector(".session-confirm"),"inline clear confirmation");btn(document.querySelector(".session-confirm"),"Batal").click();assert(document.querySelector(".workspace .grid article"),"cancel retains assets");
 erase.click();btn(document.querySelector(".session-confirm"),"Hapus sesi").click();await wait(()=>document.querySelector(".chat-home"),"clear returns to assistant");nav.querySelector('[aria-label="Aset sesi"]').click();assert(!document.querySelector(".workspace .grid article"),"confirmed clear removes assets");

 nav.querySelector('[aria-label="Cari alat"]').click();const roiSearch=document.querySelector('input[aria-label="Cari alat"]');roiSearch.value="roi";roiSearch.dispatchEvent(new Event("input",{bubbles:true}));const roiCard=document.querySelector('[data-tool="roi-calculator"]');assert(roiCard,"ROI search");roiCard.click();
 const numbers={price:"15000",cogs:"7000",extra:"1000",adSpend:"50000",orders:"10"};for(const [k,v] of Object.entries(numbers))document.querySelector("#roi-"+k).value=v;
 btn(document,"Hitung hasil").click();const metrics=document.querySelector(".roi-metrics");assert(metrics&&metrics.textContent.includes("20.000")&&metrics.textContent.includes("3×")&&metrics.textContent.includes("15,38%"),"ROI calculation exact local output");assert(calls===0,"calculator uses zero AI calls");assert(document.documentElement.scrollWidth<=window.innerWidth+1,"ROI 360px overflow");
 // Actual Canvas rendering with an injected test-only provider image.
 const copyCalls=[],originalFill=CanvasRenderingContext2D.prototype.fillText;
 CanvasRenderingContext2D.prototype.fillText=function(t,...args){copyCalls.push(t);return originalFill.call(this,t,...args);};
 try{
  const out=await renderTextOverlay(getFeature("poster"),{brief:"Meja makan",headline:"BAKSO LEN Rp15.000!",cta:"Pesan sekarang",ratio:"4:5"},createAIClient(bridge));
  assert(out.width===1280&&out.height===1600&&out.processing==="text-overlay","poster output dimensions");
  assert(copyCalls.join(" ").includes("BAKSO LEN Rp15.000!")&&copyCalls.join(" ").includes("Pesan sekarang"),"literal headline and CTA drawn");
  assert(calls===1,"one backdrop request only");const picture=await img(out);assert(picture.naturalWidth===1280&&picture.naturalHeight===1600,"PNG decodes");
 }finally{CanvasRenderingContext2D.prototype.fillText=originalFill;}
 window.__smoke={ok:true,detail:"12MP working-photo resize and alpha preservation, PNG round-trip, local sharpen, 360px workspace, alpha upload, review, product mode and automatic opaque input workflow, asset chaining, inline clear confirmation, literal poster overlay, local advertising calculator and mocked vision failure feedback passed"};
}
run().catch(e=>{window.__smoke={ok:false,detail:(e.stack||String(e))+" | status: "+document.querySelector(".input-panel .status")?.textContent+" | output: "+document.querySelector(".output-panel")?.textContent?.slice(0,400)}});
</script></body></html>

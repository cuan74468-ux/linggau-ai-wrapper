<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Linggau AI Studio</title>
<style>body{margin:0;background:#f7f7f4;color:#202321;font:15px/1.5 system-ui,sans-serif}#app{min-height:100vh}.boot{max-width:460px;margin:32px auto;padding:20px;overflow-wrap:anywhere}button{font:inherit;min-height:44px;cursor:pointer}</style>
</head>
<body>
<main id="app" aria-busy="true"><section class="boot"><h1>Linggau AI Studio</h1><p role="status">Memuat workspace…</p></section></main>
<script>
const apiKey = "";
const CDN = "https://cdn.jsdelivr.net/gh/cuan74468-ux/linggau-ai-wrapper";
const PREVIEW_REF = ""; // Optional immutable SHA override for debugging.
const UPDATE_CHANNEL = "preview"; // preview or stable; change only during initial migration.
const IMAGE_MODEL = "gemini-3.1-flash-image";
const TEXT_MODEL = "gemini-3-flash-preview";
const TYPES = ["image/jpeg","image/png","image/webp"];
const RATIOS = ["1:1","4:5","3:4","4:3","9:16","16:9"];
const MAX_IMAGE = 8*1024*1024, MAX_TOTAL = 12*1024*1024;
let inFlight = false;
let stage = "INIT";

function bytes(image) {
  const b = image?.base64;
  if (!TYPES.includes(image?.mimeType) || typeof b !== "string" || !b || b.length % 4 ||
      b.length > Math.ceil(MAX_IMAGE/3)*4 || !/^[A-Za-z0-9+/]+={0,2}$/.test(b)) throw Error("AI_INPUT_INVALID");
  return b.length*3/4-(b.endsWith("==")?2:b.endsWith("=")?1:0);
}

function prepare(kind, req) {
  const {prompt, images=[], aspectRatio} = req || {};
  if (!["edit","image","text"].includes(kind) || typeof prompt !== "string" || !prompt.trim() || prompt.length>12000 ||
      !Array.isArray(images) || (kind==="edit" ? images.length<1||images.length>2 : images.length!==0) ||
      (aspectRatio!==undefined && (!RATIOS.includes(aspectRatio)||kind==="text"))) throw Error("AI_INPUT_INVALID");
  const sizes=images.map(bytes);
  if(sizes.some(n=>n>MAX_IMAGE)||sizes.reduce((a,b)=>a+b,0)>MAX_TOTAL) throw Error("IMAGE_LIMIT");
  const parts=[{text:prompt.trim()},...images.map(i=>({inlineData:{mimeType:i.mimeType,data:i.base64}}))];
  const generationConfig=kind==="text"?{responseModalities:["TEXT"]}:{responseModalities:["TEXT","IMAGE"]};
  if(aspectRatio) generationConfig.imageConfig={aspectRatio};
  return {model:kind==="text"?TEXT_MODEL:IMAGE_MODEL,payload:{contents:[{role:"user",parts}],generationConfig}};
}

async function request(kind, req) {
  if(inFlight)throw Error("AI_BUSY");
  const {model,payload}=prepare(kind,req);
  inFlight=true;
  const controller=new AbortController(), start=performance.now();
  const timer=setTimeout(()=>controller.abort(),120000);
  try{
    // Empty key only in the Gemini Canvas context. No alternate credential or fallback.
    const endpoint="https://generativelanguage.googleapis.com/v1beta/models/"+model+":generateContent?key="+apiKey;
    const response=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},signal:controller.signal,body:JSON.stringify(payload)});
    if(!response.ok)throw Error("AI_HTTP_"+response.status);
    const json=await response.json();
    const candidate=json?.candidates?.[0], parts=candidate?.content?.parts;
    if(!Array.isArray(parts)||["SAFETY","BLOCKLIST","PROHIBITED_CONTENT","RECITATION"].includes(candidate?.finishReason))throw Error("AI_NO_VALID_OUTPUT");
    const meta={model,httpStatus:response.status,elapsedMs:Math.round(performance.now()-start)};
    if(kind==="text"){
      const text=parts.filter(p=>!p.thought&&typeof p.text==="string").map(p=>p.text).join("\n").trim();
      if(!text||text.length>40000)throw Error("AI_NO_VALID_TEXT");
      return {kind:"text",text,...meta};
    }
    const part=parts.find(p=>!p.thought&&TYPES.includes(p?.inlineData?.mimeType)&&typeof p.inlineData.data==="string");
    if(!part)throw Error("AI_NO_VALID_IMAGE");
    const image={mimeType:part.inlineData.mimeType,base64:part.inlineData.data};
    if(bytes(image)>MAX_IMAGE)throw Error("AI_OUTPUT_INVALID");
    return {kind:"image",...image,...meta};
  }catch(e){
    if(controller.signal.aborted)throw Error("AI_TIMEOUT_120S");
    throw e;
  }finally{clearTimeout(timer);inFlight=false;}
}

const aiBridge=Object.freeze({
  available:true,
  editImage:req=>request("edit",req),
  generateImage:req=>request("image",req),
  generateText:req=>request("text",req)
});

function validateManifest(m) {
  const semver=/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/;
  if(!m||![1,2].includes(m.shellApi)||m.entry!=="src/app.js"||typeof m.version!=="string"||m.version.length>64||!semver.test(m.version)||m.release!==m.version)throw Error("MANIFEST_INCOMPATIBLE");
  return m;
}

/* BOOTSTRAP */
const KNOWN_GOOD_PREVIEW = "1340f044b4f16355b70829fca267d920eb38618d";
function validateChannel(m){
  if(!m||m.shellApi!==2||m.entry!=="src/app.js"||typeof m.commit!=="string"||!/^[0-9a-f]{40}$/.test(m.commit)||typeof m.version!=="string"||!/^0\.\d+\.\d+$/.test(m.version))throw Error("CHANNEL_MANIFEST_INVALID");
  return m;
}
function mutableManifestURL(channel){
  const root="https://raw.githubusercontent.com/cuan74468-ux/linggau-ai-wrapper/";
  if(channel==="preview")return root+"preview-channel/channel.json";
  if(channel==="stable")return root+"main/manifest.json";
  throw Error("CHANNEL_INVALID");
}
function deadline(promise, ms, code) {
  let timer;
  return Promise.race([promise,new Promise((_,reject)=>{
    timer=setTimeout(()=>reject(Error(code)),ms);
  })]).finally(()=>clearTimeout(timer));
}

async function bootstrap(ref=PREVIEW_REF){
  const root=document.getElementById("app");
  root.setAttribute("aria-busy","true");
  const screen=document.createElement("section");screen.className="boot";
  const title=document.createElement("h1");title.textContent="Linggau AI Studio";
  const message=document.createElement("p");message.setAttribute("role","status");
  const detail=document.createElement("small");detail.textContent=ref?"Preview "+ref.slice(0,12):"Kanal "+UPDATE_CHANNEL;
  screen.append(title,message,detail);root.replaceChildren(screen);
  function progress(next,text){stage=next;message.textContent=text;}
  try{
    if(apiKey!==""||ref&&!/^[0-9a-f]{40}$/.test(ref)||!["preview","stable"].includes(UPDATE_CHANNEL))throw Error("SHELL_CONFIG_INVALID");
    progress("MANIFEST","Memeriksa manifest versi…");
    const controller=new AbortController(), timer=setTimeout(()=>controller.abort(),15000);
    let manifest;
    try{
      manifest=await deadline((async()=>{
        const channel=!ref&&UPDATE_CHANNEL==="preview";
        const manifestURL=ref?CDN+"@"+ref+"/manifest.json":mutableManifestURL(UPDATE_CHANNEL);
        const res=await fetch(manifestURL,{cache:"no-store",credentials:"omit",redirect:"error",signal:controller.signal});
        if(!res.ok)throw Error("MANIFEST_HTTP_"+res.status);
        return channel?validateChannel(await res.json()):validateManifest(await res.json());
      })(),15000,"MANIFEST_TIMEOUT_15S");
    }finally{clearTimeout(timer);controller.abort();}
    progress("MODULE","Memuat modul dan dependensi CDN…");
    const selected=ref||manifest.commit||manifest.release;
    const url=CDN+"@"+selected+"/"+manifest.entry;
    const app=await deadline(import(url),20000,"MODULE_TIMEOUT_20S");
    if(typeof app.mount!=="function")throw Error("MOUNT_MISSING");
    progress("MOUNT","Menyiapkan antarmuka…");
    const bridge=manifest.shellApi===1?Object.freeze({available:false,async editImage(){throw Error("AI_BRIDGE_NOT_CONNECTED");}}):aiBridge;
    // Mount in a detached staging root: a timed-out mount cannot overwrite the error or fallback screen.
    const staging=document.createElement("div");
    await deadline(Promise.resolve().then(()=>app.mount({root:staging,ai:bridge,version:manifest.version,revision:selected})),10000,"MOUNT_TIMEOUT_10S");
    root.replaceChildren(staging);
    root.setAttribute("aria-busy","false");
    console.info("APP_BOOT_OK",manifest.version,ref?"PREVIEW":"STABLE");
  }catch(e){
    root.setAttribute("aria-busy","false");
    title.textContent="Workspace belum dapat dimuat";
    message.textContent=stage+": "+String(e?.message||e);
    message.setAttribute("role","alert");
    const retry=document.createElement("button");retry.textContent="Coba lagi";retry.onclick=()=>location.reload();
    screen.append(document.createElement("br"),retry);
    if((ref||UPDATE_CHANNEL==="preview")&&ref!==KNOWN_GOOD_PREVIEW){
      const fallback=document.createElement("button");fallback.textContent="Buka workspace sebelumnya";fallback.onclick=()=>bootstrap(KNOWN_GOOD_PREVIEW);screen.append(fallback);
    }
    root.replaceChildren(screen);
    console.error("APP_BOOT_FAILED",stage,e);
  }
}
bootstrap();
</script>
</body>
</html>

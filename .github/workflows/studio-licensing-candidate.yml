name: Studio licensing client tests (no deploy)
on:
  push:
    branches: [studio-licensing-candidate]
permissions:
  contents: read
concurrency:
  group: studio-license-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked build-only dependencies without lifecycle scripts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/studio-minifier"
          cp prototypes/studio-licensing/build-tools/package*.json "$RUNNER_TEMP/studio-minifier/"
          npm ci --prefix "$RUNNER_TEMP/studio-minifier" --ignore-scripts --no-audit --no-fund
      - name: Verify exact pinned module content against checkout before browser fixtures
        run: |
          set -euo pipefail
          APP_REF=$(node --input-type=module -e 'import {APP_REF} from "./prototypes/studio-licensing/build-pilot-shell.mjs";console.log(APP_REF)')
          LICENSE_REF=$(node --input-type=module -e 'import {LICENSE_REF} from "./prototypes/studio-licensing/build-pilot-shell.mjs";console.log(LICENSE_REF)')
          git diff --exit-code "$APP_REF" HEAD -- src manifest.json
          git diff --exit-code "$LICENSE_REF" HEAD -- prototypes/studio-licensing/client.mjs prototypes/studio-licensing/gate.mjs prototypes/studio-licensing/login-ui.mjs
          echo "STUDIO_PINNED_SOURCE_PARITY_PASS"
      - name: Test license client and shell packaging
        env:
          STUDIO_MINIFIER_DIR: ${{ runner.temp }}/studio-minifier
        run: node --test prototypes/studio-licensing/*.test.mjs
      - name: Existing application unit regression
        run: node --experimental-default-type=module --test tests/*.test.js
      - name: Chromium licensed UI and actual workspace with synthetic transport
        run: node --experimental-default-type=module tests/browser/run.mjs --studio-license
      - name: Generate temporary shell only (not published or licensed)
        env:
          STUDIO_MINIFIER_DIR: ${{ runner.temp }}/studio-minifier
        run: node prototypes/studio-licensing/minify-shell.mjs canvas/shell.html "$RUNNER_TEMP/shell.min.html"
      - name: Generate separate default-off pilot shell (temporary only)
        run: node prototypes/studio-licensing/build-pilot-shell.mjs canvas/shell.html "$RUNNER_TEMP/pilot-shell.html"
      - name: Browser default-off pilot shell
        run: node --experimental-default-type=module tests/browser/run.mjs --studio-pilot-disabled
      - name: Browser configured pilot shell with synthetic local transport
        run: node --experimental-default-type=module tests/browser/run.mjs --studio-pilot-configured
      - name: Browser parity for minified pilot shell with synthetic local transport
        env:
          STUDIO_MINIFIER_DIR: ${{ runner.temp }}/studio-minifier
        run: node --experimental-default-type=module tests/browser/run.mjs --studio-pilot-minified
  immutable-pilot-cdn:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify exact public CDN bytes and module response headers
        run: node prototypes/studio-licensing/check-pilot-cdn.mjs

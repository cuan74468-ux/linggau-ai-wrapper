name: Studio CI
on:
  push:
    branches: [main, release-0.2.0, release-0.3.0, loader-hardening]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source credential and manifest checks
        run: node scripts/check-release.mjs
      - run: node --experimental-default-type=module --test tests/*.test.js

      - name: Chromium local browser smoke (no provider calls)
        run: node --experimental-default-type=module tests/browser/run.mjs
      - name: Actual MediaPipe portrait segmentation and verified PNG (public test image)
        run: node --experimental-default-type=module tests/browser/run.mjs --real-vision
      - name: Annotated portrait quality comparison (P3M-500-P fixed rows)
        run: node --experimental-default-type=module tests/browser/run.mjs --matte-benchmark
      - name: Product quality gate (actual local route, annotated products and labeled packs)
        run: node --experimental-default-type=module tests/browser/run.mjs --product-benchmark
      - name: Preserve public product QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-visual-qa
          path: qa-artifacts/
          if-no-files-found: ignore
          retention-days: 3

  immutable-cdn:
    if: github.event_name == 'push' && github.ref == 'refs/heads/loader-hardening'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact immutable application bytes before promotion
        run: node scripts/check-release.mjs --cdn

  pages-pointer-check:
    if: github.event_name == 'push' && github.ref == 'refs/heads/loader-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-pages.mjs
      - name: Real Chromium Pages loader and immutable Preview mount (no AI call)
        run: node --experimental-default-type=module tests/browser/run.mjs --live-loader
